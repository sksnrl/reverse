<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미지 슬라이더</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }
    .slider-container {
      position: relative;
      width: 500px;              /* 고정 너비 */
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      background-color: #fff;
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
.slide {
  min-width: 0; /* 500px 고정 폭 제거 */
  width: 100%;   /* 부모 요소에 맞게 너비를 채움 */
  box-sizing: border-box;
  flex-shrink: 0;
}

.slide img {
  display: block;
  width: 100%;   /* 부모 .slide의 폭에 맞게 자동 조절 */
  height: auto;
}
    /* 버튼 스타일 */
    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }
    .nav-button:hover {
      background-color: rgba(0,0,0,0.7);
    }
    .nav-prev {
      left: 10px;
    }
    .nav-next {
      right: 10px;
    }
    /* 점 네비게이션 */
    .dots {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 0 4px;
      background-color: rgba(0,0,0,0.3);
      border-radius: 50%;
      cursor: pointer;
    }
    .dot.active {
      background-color: rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <div class="slider-container">
    <div class="slides" id="slides">
      <!-- 여기 이미지 슬라이드 항목들 -->
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/619668ee73bc315fa.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/685368ee73be44001.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/864468ee73bfeaf4a.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/104868ee73c2022dc.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/640668ee73c3e94dd.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/189668ee73c601496.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/680668ee73c73709d.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/587468ee73c910f6a.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/290768ee73ca888cb.png" /></div>
      <div class="slide"><img src="https://stimg.sooplive.co.kr/NORMAL_BBS/9/21185059/384368ee73cba872b.png" /></div>
    </div>

    <button class="nav-button nav-prev" id="btnPrev">&#8249;</button>
    <button class="nav-button nav-next" id="btnNext">&#8250;</button>

    <div class="dots" id="dots">
      <!-- 점 항목은 JS로 채워짐 -->
    </div>
  </div>

  <script>
    const slidesDiv = document.getElementById('slides');
    const slides = document.querySelectorAll('.slide');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const dotsContainer = document.getElementById('dots');

    let currentIndex = 0;
    const total = slides.length;

    // 점 네비게이션 생성
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('span');
      dot.classList.add('dot');
      dot.dataset.index = i;
      dot.addEventListener('click', (e) => {
        goToSlide(parseInt(e.target.dataset.index));
      });
      dotsContainer.appendChild(dot);
    }

    const dots = document.querySelectorAll('.dot');

    function updateDots() {
      dots.forEach((d, i) => {
        d.classList.toggle('active', i === currentIndex);
      });
    }

    function goToSlide(idx) {
      if (idx < 0) idx = total - 1;
      if (idx >= total) idx = 0;
      currentIndex = idx;
      const offset = -idx * 500;  // 이미지 너비 500px 기준
      slidesDiv.style.transform = `translateX(${offset}px)`;
      updateDots();
    }

    btnPrev.addEventListener('click', () => {
      goToSlide(currentIndex - 1);
    });
    btnNext.addEventListener('click', () => {
      goToSlide(currentIndex + 1);
    });
//터치
    let startX = 0;
let endX = 0;
const threshold = 50; // 최소 스와이프 거리 (픽셀)

slidesDiv.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
}, { passive: true });

slidesDiv.addEventListener('touchmove', (e) => {
  endX = e.touches[0].clientX;
}, { passive: true });

slidesDiv.addEventListener('touchend', () => {
  const distance = endX - startX;
  if (Math.abs(distance) > threshold) {
    if (distance < 0) {
      // 왼쪽으로 스와이프 → 다음 슬라이드
      goToSlide(currentIndex + 1);
    } else {
      // 오른쪽으로 스와이프 → 이전 슬라이드
      goToSlide(currentIndex - 1);
    }
  }
});
//슬라이더 반응형
    const sliderContainer = document.querySelector('.slider-container');

function goToSlide(idx) {
  if (idx < 0) idx = total - 1;
  if (idx >= total) idx = 0;
  currentIndex = idx;

  const slideWidth = sliderContainer.clientWidth;
  slidesDiv.style.transform = `translateX(${-idx * slideWidth}px)`;
  updateDots();
}

window.addEventListener('resize', () => {
  goToSlide(currentIndex);
});
    // 초기 세팅
    goToSlide(0);
  </script>

</body>
</html>
